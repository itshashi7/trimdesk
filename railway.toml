# Railway build and deploy settings (https://docs.railway.com/reference/config-as-code)
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# The login page is public and served by Spring, so it doubles as the health check.
healthcheckPath = "/"
# The first boot creates the schema and seeds ~39k demo bills; give it time.
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
