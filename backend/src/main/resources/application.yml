server:
  # 8080 is often taken on dev machines; override with PORT on the host.
  port: ${PORT:8081}

spring:
  application:
    name: groomdesk
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/groomdesk?reWriteBatchedInserts=true}
    username: ${DB_USER:groomdesk}
    password: ${DB_PASSWORD:groomdesk}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

groomdesk:
  jwt:
    # Demo default only. Set JWT_SECRET (32+ bytes) on any public deployment.
    secret: ${JWT_SECRET:groomdesk-local-dev-secret-change-me-0123456789}
    ttl: 12h
  cors:
    # Vite dev server; add the deployed frontend origin via CORS_ORIGINS (comma-separated).
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
