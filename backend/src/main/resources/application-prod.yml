# Production profile (Railway). Activate with SPRING_PROFILES_ACTIVE=prod.
# Required variables: DB_URL, DB_USER, DB_PASSWORD, JWT_SECRET. Railway sets PORT.
server:
  # Railway terminates HTTPS at its proxy. Spring's forwarded-header support is off on purpose:
  # it takes the LEFTMOST X-Forwarded-For entry, which the visitor controls. Nothing here builds
  # URLs from the scheme or host, and the one place that needs the caller's IP (crash-report rate
  # limit) reads X-Real-IP, which Railway's edge overwrites, via groomdesk.trust-proxy below.
  forward-headers-strategy: none
  compression:
    enabled: true
  error:
    include-stacktrace: never

spring:
  jpa:
    show-sql: false

groomdesk:
  # Railway's edge sits in front and overwrites X-Real-IP with the connecting address: trust it.
  trust-proxy: true
