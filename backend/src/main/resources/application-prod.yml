# Production profile (Railway). Activate with SPRING_PROFILES_ACTIVE=prod.
# Required variables: DB_URL, DB_USER, DB_PASSWORD, JWT_SECRET. Railway sets PORT.
server:
  # Railway terminates HTTPS at its proxy. This MUST stay on: without it Spring sees plain http on
  # an internal port, the browser's Origin (https://<app>.up.railway.app) no longer looks
  # same-origin, and the CORS check answers every browser login with 403 "Invalid CORS request"
  # (happened on 20 Nov 2026). Do not use request.getRemoteAddr() for rate limits, though: it then
  # comes from the visitor-controlled leftmost X-Forwarded-For. See ClientAddress.
  forward-headers-strategy: framework
  compression:
    enabled: true
  error:
    include-stacktrace: never

spring:
  jpa:
    show-sql: false

groomdesk:
  # Railway's edge sits in front and overwrites X-Real-IP with the connecting address: trust it.
  trust-proxy: true
